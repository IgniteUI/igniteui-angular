name: Npm.js deploy

on:
  release:
    types: [published]

permissions: {}

concurrency:
  group: release-${{ github.ref_name }}

env:
  VERSION: ${{ github.event.release.tag_name }}
  NG_CLI_ANALYTICS: false
  NODE_VERSION: 24.x

jobs:
  # Builds and inventories the release. Holds no publishing rights and no OIDC token.
  build:
    name: Build and inventory
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    outputs:
      npm-tag: ${{ steps.npm-tag.outputs.npm-tag }}
      lib-tarball: ${{ steps.digests.outputs.lib-tarball }}
      lib-sha256: ${{ steps.digests.outputs.lib-sha256 }}
      i18n-tarball: ${{ steps.digests.outputs.i18n-tarball }}
      i18n-sha256: ${{ steps.digests.outputs.i18n-sha256 }}
      extras-tarball: ${{ steps.digests.outputs.extras-tarball }}
      extras-sha256: ${{ steps.digests.outputs.extras-sha256 }}

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      # No dependency cache: a release build must resolve from the registry, not from a cache entry.
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: 'https://registry.npmjs.org'

      - run: npm ci

      - name: Build igniteui-angular
        run: |
            npm run build:lib
            npm run build:schematics
            npm run build:migrations

      - name: Build igniteui-angular-i18n
        run: npm run build:i18n

      - name: Build igniteui-angular-extras
        run: npm run build:extras

      - name: Define npm tag
        id: npm-tag
        run: |
            if [[ ${VERSION} == *"alpha"* || ${VERSION} == *"beta"* || ${VERSION} == *"rc"* ]]; then echo "npm-tag=next"; else echo "npm-tag=latest"; fi >> $GITHUB_OUTPUT

      - name: Copy readme, license & skills for igniteui-angular
        run: |
            cp ../../README.md README.md
            cp ../../LICENSE LICENSE
            cp -r ../../skills/. skills
        working-directory: dist/igniteui-angular

      - name: Copy i18n files
        run: |
            cp ../../projects/igniteui-angular-i18n/README.md README.md
            cp ../../projects/igniteui-angular-i18n/package.json package.json
            cp ../../projects/igniteui-angular-i18n/LICENSE LICENSE
        working-directory: dist/igniteui-angular-i18n

      - name: Copy extras files
        run: |
            cp ../../projects/igniteui-angular-extras/README.md README.md
            cp ../../projects/igniteui-angular-extras/LICENSE LICENSE
        working-directory: dist/igniteui-angular-extras

      - name: Create igniteui-angular version
        run: npm version ${VERSION} --no-git-tag-version --save --verbose
        working-directory: dist/igniteui-angular

      - name: Create igniteui-angular-i18n version
        run: npm version ${VERSION} --no-git-tag-version --save
        working-directory: dist/igniteui-angular-i18n

      - name: Create igniteui-angular-extras version
        run: npm version ${VERSION} --no-git-tag-version --save
        working-directory: dist/igniteui-angular-extras

      # Packs igniteui-angular, then describes the exact tarball it produced. Everything downstream
      # uses that same file, so the SBOMs, the digests and the attestations all agree.
      - name: Generate delivered SBOM (CycloneDX 1.6)
        run: npm run build:sbom -- --version=${VERSION} --out=artifacts --keep

      - name: Generate delivered SBOM (SPDX 2.3)
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          path: artifacts/.delivered
          format: spdx-json
          output-file: artifacts/infragistics-angular-${{ env.VERSION }}.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Generate build environment SBOM (CycloneDX 1.6)
        run: npm run build:sbom -- --version=${VERSION} --out=artifacts --build-env

      - name: Pack igniteui-angular-i18n and igniteui-angular-extras
        run: |
            set -euo pipefail
            npm pack dist/igniteui-angular-i18n --pack-destination artifacts
            npm pack dist/igniteui-angular-extras --pack-destination artifacts

      - name: Record package digests
        id: digests
        run: |
            set -euo pipefail
            cd artifacts

            for name in igniteui-angular-i18n igniteui-angular-extras; do
              sha256sum "${name}-${VERSION}.tgz" > "${name}-${VERSION}.tgz.sha256"
              sha512sum "${name}-${VERSION}.tgz" > "${name}-${VERSION}.tgz.sha512"
            done

            {
              echo "lib-tarball=igniteui-angular-${VERSION}.tgz"
              echo "lib-sha256=$(sha256sum "igniteui-angular-${VERSION}.tgz" | cut -d' ' -f1)"
              echo "i18n-tarball=igniteui-angular-i18n-${VERSION}.tgz"
              echo "i18n-sha256=$(sha256sum "igniteui-angular-i18n-${VERSION}.tgz" | cut -d' ' -f1)"
              echo "extras-tarball=igniteui-angular-extras-${VERSION}.tgz"
              echo "extras-sha256=$(sha256sum "igniteui-angular-extras-${VERSION}.tgz" | cut -d' ' -f1)"
            } >> $GITHUB_OUTPUT

            { echo "### Packed artifacts"; echo '```'; sha256sum *.tgz; echo '```'; } >> $GITHUB_STEP_SUMMARY

      # The delivered install tree sits in the hidden artifacts/.delivered and is deliberately not uploaded.
      - name: Upload release artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-artifacts
          path: artifacts/*
          retention-days: 30
          if-no-files-found: error

  attest:
    name: Attest artifacts
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
      attestations: write
    env:
      # Artifact attestations are unavailable in private repositories outside GitHub Enterprise Cloud.
      ATTESTATIONS_ENABLED: ${{ !github.event.repository.private }}

    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-artifacts
          path: artifacts
          digest-mismatch: error

      - name: Verify the packages are the ones that were built
        env:
          EXPECTED: |
            ${{ needs.build.outputs.lib-sha256 }}  ${{ needs.build.outputs.lib-tarball }}
            ${{ needs.build.outputs.i18n-sha256 }}  ${{ needs.build.outputs.i18n-tarball }}
            ${{ needs.build.outputs.extras-sha256 }}  ${{ needs.build.outputs.extras-tarball }}
        run: |
            set -euo pipefail
            cd artifacts
            printf '%s' "$EXPECTED" | sha256sum --check --strict

      - name: Attest build provenance
        id: attest-provenance
        if: env.ATTESTATIONS_ENABLED == 'true'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: artifacts/*.tgz

      - name: Attest SBOM (CycloneDX)
        id: attest-sbom-cyclonedx
        if: env.ATTESTATIONS_ENABLED == 'true'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: artifacts/${{ needs.build.outputs.lib-tarball }}
          sbom-path: artifacts/infragistics-angular-${{ env.VERSION }}.cdx.json

      - name: Attest SBOM (SPDX)
        id: attest-sbom-spdx
        if: env.ATTESTATIONS_ENABLED == 'true'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: artifacts/${{ needs.build.outputs.lib-tarball }}
          sbom-path: artifacts/infragistics-angular-${{ env.VERSION }}.spdx.json

      - name: Collect attestation bundles
        if: env.ATTESTATIONS_ENABLED == 'true'
        run: |
            set -euo pipefail
            mkdir -p attestations
            cp "${{ steps.attest-provenance.outputs.bundle-path }}" attestations/provenance.sigstore.json
            cp "${{ steps.attest-sbom-cyclonedx.outputs.bundle-path }}" attestations/sbom-cyclonedx.sigstore.json
            cp "${{ steps.attest-sbom-spdx.outputs.bundle-path }}" attestations/sbom-spdx.sigstore.json

            {
              echo "### Attestations"
              echo "- Provenance: ${{ steps.attest-provenance.outputs.attestation-url }}"
              echo "- SBOM (CycloneDX): ${{ steps.attest-sbom-cyclonedx.outputs.attestation-url }}"
              echo "- SBOM (SPDX): ${{ steps.attest-sbom-spdx.outputs.attestation-url }}"
            } >> $GITHUB_STEP_SUMMARY

      - name: Upload attestation bundles
        if: env.ATTESTATIONS_ENABLED == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: attestations
          path: attestations/*
          retention-days: 30
          if-no-files-found: error

  # The only job that can publish. It compiles nothing and never checks out the repository.
  # TODO: re-enable once npm Trusted Publishing is configured for the three packages on npmjs.com.
  # Disabled so releases can be exercised end to end from this fork without touching npmjs.org.
  publish:
    name: Publish to npmjs.org
    if: false
    needs: [build, attest]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: npm Deploy
    permissions:
      id-token: write

    steps:
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: 'https://registry.npmjs.org'

      - name: Download release artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-artifacts
          path: artifacts
          digest-mismatch: error

      - name: Verify the packages that were built and attested
        env:
          EXPECTED: |
            ${{ needs.build.outputs.lib-sha256 }}  ${{ needs.build.outputs.lib-tarball }}
            ${{ needs.build.outputs.i18n-sha256 }}  ${{ needs.build.outputs.i18n-tarball }}
            ${{ needs.build.outputs.extras-sha256 }}  ${{ needs.build.outputs.extras-tarball }}
        run: |
            set -euo pipefail
            cd artifacts
            printf '%s' "$EXPECTED" | sha256sum --check --strict

      # Publishing the packed tarballs guarantees the published bytes are the attested bytes.
      # Authentication and npm provenance both come from the OIDC token, so no npm token is needed.
      - name: Publish packages
        env:
          NPM_TAG: ${{ needs.build.outputs.npm-tag }}
        run: |
            set -euo pipefail
            cd artifacts
            npm publish "${{ needs.build.outputs.lib-tarball }}" --tag "$NPM_TAG"
            npm publish "${{ needs.build.outputs.i18n-tarball }}" --tag "$NPM_TAG"
            npm publish "${{ needs.build.outputs.extras-tarball }}" --tag "$NPM_TAG"

  attach-to-release:
    name: Attach release evidence
    needs: [build, attest]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-artifacts
          path: artifacts

      - name: Download attestation bundles
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        continue-on-error: true
        with:
          name: attestations
          path: attestations

      - name: Attach evidence to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
            set -euo pipefail

            zip -j "infragistics-angular-${VERSION}.sbom.zip" \
              "artifacts/infragistics-angular-${VERSION}.cdx.json" \
              "artifacts/infragistics-angular-${VERSION}.spdx.json" \
              "artifacts/infragistics-angular-${VERSION}.build-env.cdx.json" \
              "artifacts/infragistics-angular-${VERSION}.sbom.README.md"

            gh release upload "$TAG" --clobber -R "${{ github.repository }}" \
              artifacts/*.tgz \
              artifacts/*.tgz.sha256 \
              artifacts/*.tgz.sha512 \
              "artifacts/infragistics-angular-${VERSION}.cdx.json" \
              "infragistics-angular-${VERSION}.sbom.zip" \
              $(ls attestations/*.json 2>/dev/null || true)

  dispatch-api-update:
    # Gated by the publish job, so it stays skipped for as long as publishing is disabled.
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions: {}
    steps:
      - name: Get app token
        id: app-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2.2.2
        with:
          app-id: ${{ secrets.IGNITEUI_GITHUB_APP_ID }}
          private-key: ${{ secrets.IGNITEUI_GITHUB_APP_PRIVATE_KEY }}
          owner: IgniteUI
      - name: Trigger API update workflow
        uses: peter-evans/repository-dispatch@28959ce8df70de7be546dd1250a005dd32156697
        with:
          token: ${{ steps.app-token.outputs.token }}
          repository: IgniteUI/igniteui-angular-api-i18n
          event-type: api-update
          client-payload: |
            {
              "release_tag": "${{ github.event.release.tag_name }}"
            }

