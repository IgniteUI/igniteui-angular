<input #checkbox class="igx-switch__input" type="checkbox"
    [id]="inputId"
    [name]="_name()"
    [value]="_value()"
    [tabindex]="_tabindex()"
    [disabled]="_disabled()"
    [checked]="_checked()"
    [required]="required"
    [attr.aria-required]="required"
    [attr.aria-invalid]="_invalid()"
    [attr.aria-checked]="_checked()"
    [attr.aria-labelledby]="_ariaLabel() ? null : _ariaLabelledBy()"
    [attr.aria-label]="_ariaLabel()"
    (change)="_onCheckboxChange($event)"
    (blur)="onBlur()" />

<span #label class="igx-switch__composite"
    igxRipple
    igxRippleTarget=".igx-switch__ripple"
    [igxRippleDisabled]="_disableRipple()"
    [igxRippleCentered]="true"
    [igxRippleDuration]="300">
    <div class="igx-switch__composite-thumb">
        <div class="igx-switch__ripple"></div>
        <div class="igx-switch__thumb"></div>
    </div>
</span>

<span #placeholderLabel
    [class]="_labelClass()"
    [id]="_labelId()">
    <ng-content></ng-content>
</span>
