<div
  class="igx-virtual-scroll__track"
  role="presentation"
  [style.height.px]="_isVertical() ? _spaceSize() : null"
  [style.width.px]="!_isVertical() ? _spaceSize() : null"
>
  <div
    class="igx-virtual-scroll__content"
    #contentDiv
    role="presentation"
    [style.transform]="_contentTransform()"
  >
    @if (_resolvedTemplate(); as template) {
      @for (context of _renderedItems(); track $index) {
        <div
          class="igx-virtual-item"
          role="presentation"
          [attr.data-index]="context.index"
        >
          <ng-container
            [ngTemplateOutlet]="template"
            [ngTemplateOutletContext]="context"
          />
        </div>
      }
    }
  </div>
</div>
