<ng-content></ng-content>

<ng-template #defaultEmptyList>
    <article class="igx-list__message">
        {{resourceStrings.igx_list_no_items}}
    </article>
</ng-template>

<ng-template #defaultDataLoading>
    <article class="igx-list__message">
        {{resourceStrings.igx_list_loading}}
    </article>
</ng-template>

@if (!children || children.length === 0 || isLoading || (isNavigable && !hasOptions)) {
    <div class="igx-list__message-wrapper"
        [attr.role]="isNavigable && !hasOptions ? itemRole : null"
        [attr.aria-hidden]="isNavigable && hasOptions ? 'true' : null">
        <div class="igx-list__message-cell" [attr.role]="isGrid && !hasOptions ? 'gridcell' : null">
            <ng-container *ngTemplateOutlet="template; context: context">
            </ng-container>
        </div>
    </div>
}
