<ng-content></ng-content>

<ng-template #defaultEmptyList>
    <article class="igx-list__message">
        {{resourceStrings.igx_list_no_items}}
    </article>
</ng-template>

<ng-template #defaultDataLoading>
    <article class="igx-list__message">
        {{resourceStrings.igx_list_loading}}
    </article>
</ng-template>

@if (isNavigable && (!hasOptions || isLoading)) {
    <!-- In a listbox or grid, the message is read as the only item, or hidden while there are options. -->
    <div class="igx-list__message-wrapper"
        [attr.role]="!hasOptions ? itemRole : null"
        [attr.aria-hidden]="hasOptions ? 'true' : null">
        <div class="igx-list__message-cell" [attr.role]="isGrid && !hasOptions ? 'gridcell' : null">
            <ng-container *ngTemplateOutlet="template; context: context">
            </ng-container>
        </div>
    </div>
} @else if (!children || children.length === 0 || isLoading) {
    <ng-container *ngTemplateOutlet="template; context: context">
    </ng-container>
}
